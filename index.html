<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Código Proton VPN desde QR</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f4fb;--card:#fff;--text:#1b1b25;--muted:#6b6b7b;--accent:#6d4aff;--on-accent:#fff;--border:#d9d5ee;--err:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14141c;--card:#1f1f2b;--text:#f1f0fa;--muted:#a3a2b5;--accent:#8c70ff;--on-accent:#12101f;--border:#3a3952;--err:#ff8a80}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14141c;--card:#1f1f2b;--text:#f1f0fa;--muted:#a3a2b5;--accent:#8c70ff;--on-accent:#12101f;--border:#3a3952;--err:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:24px 18px 40px}
h1{font-size:1.4rem;margin:0 0 6px}
p.sub{color:var(--muted);margin:0 0 18px;font-size:.95rem}
.row{display:flex;gap:10px;margin-bottom:12px}
button,label.btn{flex:1;text-align:center;font:inherit;font-weight:600;border:0;border-radius:12px;padding:14px 10px;cursor:pointer;background:var(--accent);color:var(--on-accent)}
label.btn{background:var(--card);color:var(--text);border:1px solid var(--border)}
#pasteBox{min-height:90px;border:2px dashed var(--border);border-radius:12px;padding:14px;color:var(--muted);background:var(--card);outline:none;text-align:center;-webkit-user-select:text;user-select:text}
#pasteBox:empty::before{content:"O mantén pulsado aquí y elige «Pegar»"}
#pasteBox:focus{border-color:var(--accent)}
#result{display:none;margin-top:20px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px 16px;text-align:center}
#result small{color:var(--muted);display:block;margin-bottom:8px}
#code{font:700 2.6rem/1.1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;word-break:break-all;margin-bottom:18px;user-select:all;-webkit-user-select:all}
#err{display:none;margin-top:16px;color:var(--err);word-break:break-word}
</style>
</head>
<body>
<main>
  <h1>Código de activación</h1>
  <p class="sub">Pega o elige la imagen del QR de Proton VPN TV. Se lee en tu propio navegador y la imagen no se sube a ningún sitio.</p>
  <div class="row">
    <button id="pasteBtn" type="button">Pegar imagen</button>
    <label class="btn">Elegir foto<input id="file" type="file" accept="image/*" hidden></label>
  </div>
  <div id="pasteBox" contenteditable="true" inputmode="none" spellcheck="false" autocapitalize="off"></div>
  <div id="err" role="alert"></div>
  <section id="result">
    <small>Código</small>
    <div id="code"></div>
    <button id="copyBtn" type="button" style="width:100%">Copiar código</button>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
const $ = id => document.getElementById(id);

function fail(msg){
  $('result').style.display = 'none';
  $('err').textContent = msg;
  $('err').style.color = 'var(--err)';
  $('err').style.display = 'block';
}
function info(msg){
  $('result').style.display = 'none';
  $('err').textContent = msg;
  $('err').style.color = 'var(--muted)';
  $('err').style.display = 'block';
}
function show(code){
  $('err').style.display = 'none';
  $('code').textContent = code;
  $('result').style.display = 'block';
  $('result').scrollIntoView({behavior:'smooth', block:'nearest'});
}
function found(text){
  const m = text.match(/\/vpn\/tv\/code\/([A-Za-z0-9]+)/);
  if (m) show(m[1]);
  else fail('He leído un QR, pero no parece un código de Proton VPN TV. Contenido: ' + text);
}
function scan(img){
  const c = document.createElement('canvas');
  const x = c.getContext('2d', {willReadFrequently:true});
  for (const max of [1600, 1000, 2400]){
    const s = Math.min(1, max / Math.max(img.width, img.height));
    c.width = Math.round(img.width * s);
    c.height = Math.round(img.height * s);
    x.drawImage(img, 0, 0, c.width, c.height);
    const d = x.getImageData(0, 0, c.width, c.height);
    const r = jsQR(d.data, d.width, d.height, {inversionAttempts:'attemptBoth'});
    if (r) return r.data;
  }
  return null;
}
function handle(blob){
  if (typeof jsQR === 'undefined'){ fail('No se ha cargado el lector de QR. Comprueba tu conexión a internet y recarga la página.'); return; }
  if (!blob || !blob.type.startsWith('image/')){ fail('No he encontrado ninguna imagen.'); return; }
  info('Leyendo imagen…');
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    let t = null;
    try { t = scan(img); } catch(e){ URL.revokeObjectURL(url); fail('Error al leer la imagen: ' + e.message); return; }
    URL.revokeObjectURL(url);
    t ? found(t) : fail('No he podido leer ningún QR en esa imagen. Prueba con una captura más nítida o recortada al QR.');
  };
  img.onerror = () => { URL.revokeObjectURL(url); fail('No he podido abrir la imagen.'); };
  img.src = url;
}

$('pasteBtn').onclick = async () => {
  info('Toca «Pegar» cuando aparezca el aviso…');
  try{
    const items = await navigator.clipboard.read();
    for (const it of items){
      const t = it.types.find(t => t.startsWith('image/'));
      if (t){ handle(await it.getType(t)); return; }
    }
    fail('El portapapeles no tiene ninguna imagen.');
  }catch(e){
    fail('No he podido leer el portapapeles. Mantén pulsado en el recuadro de abajo y elige «Pegar», o usa «Elegir foto».');
  }
};
document.addEventListener('paste', e => {
  const f = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (f){ e.preventDefault(); handle(f.getAsFile()); $('pasteBox').textContent = ''; }
});
$('file').onchange = e => { handle(e.target.files[0]); e.target.value = ''; };
$('copyBtn').onclick = async () => {
  const t = $('code').textContent;
  try{ await navigator.clipboard.writeText(t); }
  catch(e){
    const a = document.createElement('textarea');
    a.value = t; document.body.appendChild(a); a.select();
    document.execCommand('copy'); a.remove();
  }
  $('copyBtn').textContent = '¡Copiado!';
  setTimeout(() => $('copyBtn').textContent = 'Copiar código', 1500);
};
</script>
</body>
</html>
